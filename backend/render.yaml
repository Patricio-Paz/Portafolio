services:
  - type: web
    name: premium-portfolio-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "0"

databases:
  - name: portfolio-db
    databaseName: portfolio_db
    user: portfolio_user
